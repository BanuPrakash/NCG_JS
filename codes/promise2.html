<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>  
    <script>
        function getFlights() {
            return new Promise((resolve, reject) => {
                setTimeout(() => resolve("Flights data!!!"), 2000);
            });
        }

        function getHotels() {
            return new Promise((resolve, reject) => {
                setTimeout(() => resolve("Hotels data!!!"), 3000);
            });
        }

        console.time("profile");
        Promise.all([getFlights(), getHotels()]).then(data => {
            console.log(data[0]); // flights
            console.log(data[1]); // hotels
             console.timeEnd("profile");
        })
    </script>
</body>
</html>
