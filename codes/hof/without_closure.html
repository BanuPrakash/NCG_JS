<body>
    <script>
        function fibanocci(no){ 
            if(no == 0 || no == 1) {
                return no;
            } else {
                return fibanocci(no - 1) + fibanocci(no -2);
            }
        }

        console.time("first");
            console.log(fibanocci(40));
        console.timeEnd("first");

        console.time("sec");
            console.log(fibanocci(40)); // should have be fetched from cache
        console.timeEnd("sec");

    </script>
</body>
